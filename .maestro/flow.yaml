appId: jp.co.digitalomikuji.dev
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3000

# 1. 起動確認 (IDLE state)
# Wait for i18n initialization before checking text
- extendedWaitUntil:
    visible: "スマホを振っておみくじを引こう"
    timeout: 10000

# 2. 履歴画面に遷移して戻る (Quick check)
- tapOn: "履歴"
- assertVisible: "履歴"
- assertVisible: "戻る"
- tapOn: "戻る"
- extendedWaitUntil:
    visible: "スマホを振っておみくじを引こう"
    timeout: 5000

# 3. おみくじを引く (Use Debug button for stability)
# Note: Maestro can simulate shake, but debug button is more reliable for "logic" verification if available.
# Since app/index.tsx shows "Debug" button when appVariant is development OR sensor unavailable.
# We will try tapping "おみくじを引く" or "🔧 デバッグ" depending on env.
# Assuming development build or sensor not available in emulator.
- tapOn: ".*(おみくじを引く|🔧 デバッグ).*"

# 4. 演出待ち (SHAKING -> DRAWING -> REVEALING -> RESULT)
# Transitions take about 1.5s + 1.2s + 2.0s = ~5s total
- extendedWaitUntil:
    visible: "もう一度引く" # or "運勢" or something unique in result
    timeout: 10000

# 5. 結果確認
# FortuneDisplay component verification
- assertVisible: "(大吉|吉|中吉|小吉|末吉|凶)" # Matches one of the defined fortune results
# Removed risky assertion for "これ"
# Let's check for the reset button or closing logic
- tapOn: "閉じる" 

# 6. ホームに戻っていることを確認
- assertVisible: "本日の運勢は確認済みです"
- assertVisible: "結果をもう一度見る"
