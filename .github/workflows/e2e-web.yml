name: Web E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "utils/**"
      - "data/**"
      - "i18n/**"
      - "assets/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e-web.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "utils/**"
      - "data/**"
      - "i18n/**"
      - "assets/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e-web.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (auto uses job classification)"
        type: choice
        options: [auto, slim, latest]
        default: auto

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_HEAVY: ubuntu-latest
  USAGE_GUARD_THRESHOLD: "300"

jobs:
  usage-guard:
    name: Usage Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      usable-minutes: ${{ steps.billing.outputs.usable-minutes }}
    steps:
      - name: Get billing for GitHub Actions
        id: billing
        uses: keita-hino/get-billing-for-github-actions@v1
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          account-type: user

  test:
    name: Playwright Tests
    needs: usage-guard
    if: ${{ needs.usage-guard.result == 'success' && fromJSON(needs.usage-guard.outputs.usable-minutes) >= fromJSON(env.USAGE_GUARD_THRESHOLD) }}
    runs-on: ${{ env.RUNNER_HEAVY }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Playwright ブラウザのキャッシュ (package.jsonからバージョン取得で安定化)
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run Playwright tests
        run: pnpm test:e2e:web
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
