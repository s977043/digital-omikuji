name: Deploy to Vercel

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (auto uses job classification)"
        type: choice
        options: [auto, slim, latest]
        default: auto

# Prevent concurrent deployments to avoid rate limiting
concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  usage-guard:
    name: Usage Guard
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    outputs:
      usable-minutes: ${{ steps.billing.outputs.usable-minutes }}
    steps:
      - name: Get billing for GitHub Actions
        id: billing
        uses: keita-hino/get-billing-for-github-actions@v1
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          account-type: user

  deploy:
    needs: usage-guard
    if: ${{ needs.usage-guard.result == 'success' && fromJSON(needs.usage-guard.outputs.usable-minutes) >= 300 }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'slim') && 'ubuntu-slim' || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Project Information (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Pull Vercel Project Information (Preview)
        if: github.ref != 'refs/heads/main'
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build Project Artifacts (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Build Project Artifacts (Preview)
        if: github.ref != 'refs/heads/main'
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy Project Artifacts to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Deploy Project Artifacts to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN
