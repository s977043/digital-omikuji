name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "utils/**"
      - "data/**"
      - "types/**"
      - "i18n/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".eslintrc.js"
      - ".prettierrc"
      - "jest.config.js"
      - "babel.config.js"
      - "metro.config.js"
      - "tailwind.config.js"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "utils/**"
      - "data/**"
      - "types/**"
      - "i18n/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".eslintrc.js"
      - ".prettierrc"
      - "jest.config.js"
      - "babel.config.js"
      - "metro.config.js"
      - "tailwind.config.js"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (auto uses job classification)"
        type: choice
        options: [auto, slim, latest]
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'latest') && 'ubuntu-latest' || 'ubuntu-slim' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type Check
            command: pnpm exec tsc --noEmit
          - name: ESLint
            command: pnpm lint && pnpm lint:md
          - name: Tests
            command: pnpm test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run
        run: ${{ matrix.command }}
