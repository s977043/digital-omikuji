name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "utils/**"
      - "data/**"
      - "types/**"
      - "i18n/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".eslintrc.js"
      - ".prettierrc"
      - "jest.config.js"
      - "babel.config.js"
      - "metro.config.js"
      - "tailwind.config.js"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "utils/**"
      - "data/**"
      - "types/**"
      - "i18n/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".eslintrc.js"
      - ".prettierrc"
      - "jest.config.js"
      - "babel.config.js"
      - "metro.config.js"
      - "tailwind.config.js"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (auto uses job classification)"
        type: choice
        options: [auto, slim, latest]
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || 'auto' }}
  RUNNER_LIGHT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'latest') && 'ubuntu-latest' || 'ubuntu-latest' }}
  USAGE_GUARD_THRESHOLD: "300"

jobs:
  usage-guard:
    name: Usage Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      usable-minutes: ${{ steps.billing.outputs.usable-minutes }}
    steps:
      - name: Get billing for GitHub Actions
        id: billing
        uses: keita-hino/get-billing-for-github-actions@v1
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          account-type: user

  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ env.RUNNER_LIGHT }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type Check
            command: pnpm exec tsc --noEmit
          - name: ESLint
            command: pnpm lint && pnpm lint:md
          - name: Tests
            command: pnpm test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run
        run: ${{ matrix.command }}
