name: River Reviewer

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run River Reviewer
        uses: ./river-reviewer/runners/github-action
        with:
          phase: midstream
          dry_run: "false"
          comment: "true"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
