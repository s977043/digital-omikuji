name: River Reviewer

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (auto uses job classification)"
        type: choice
        options: [auto, slim, latest]
        default: auto

env:
  USAGE_GUARD_THRESHOLD: "300"

jobs:
  usage-guard:
    name: Usage Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      usable-minutes: ${{ steps.billing.outputs.usable-minutes }}
    steps:
      - name: Get billing for GitHub Actions
        id: billing
        uses: keita-hino/get-billing-for-github-actions@v1
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          account-type: user

  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run River Reviewer
        uses: ./river-reviewer/runners/github-action
        with:
          phase: midstream
          dry_run: "false"
          comment: "true"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
